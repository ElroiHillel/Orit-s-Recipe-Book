name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 24.04 ships with the Android SDK preinstalled (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK licenses
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk orit-recipes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orit-recipes-apk
          path: orit-recipes.apk

      # A release per build gives a permanent direct link:
      # https://github.com/<owner>/<repo>/releases/latest/download/orit-recipes.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          TAG="v${VER}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" orit-recipes.apk \
            --title "ספר המתכונים של אורית ${VER}" \
            --notes "גרסה ${VER} (בנייה ${GITHUB_RUN_NUMBER}). מורידים את orit-recipes.apk ומתקינים כעדכון." \
            --latest
